[project]
name = "copilot-agent-with-git"
version = "0.1.0"
description = "demo-project"
authors = [
    {name = "Rick Hsu",email = "as123789043@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.162.6,<0.163.0)",
    "uvicorn (>=0.30.0,<1.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
